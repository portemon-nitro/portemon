name: CI

# Binding correctness CI on every push and pull request. `static` owns
# Python CI-tool contracts and static checks; the `test` matrix runs the
# repository test command on Linux and both Mac architectures. Unit,
# component, and real graphics smoke tests are required. ROM-conformance and
# acceptance tests report explicit optional skips because CI has no
# user-owned cartridge dump.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run CI tool contract tests
        run: |
          python3 scripts/ci/source_scope_test.py
          python3 scripts/ci/check_invariants_test.py
          python3 scripts/ci/codehealth_report_test.py
          python3 scripts/ci/codehealth_compare_test.py
          python3 scripts/ci/codehealth_pr_comment_test.py

      - name: Install stylua
        env:
          STYLUA_VERSION: "2.5.2"
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/stylua.zip" \
            "https://github.com/JohnnyMorganz/StyLua/releases/download/v${STYLUA_VERSION}/stylua-linux-x86_64.zip"
          sudo unzip -j "$RUNNER_TEMP/stylua.zip" stylua -d /usr/local/bin
          sudo chmod +x /usr/local/bin/stylua

      - name: Install lua-language-server
        env:
          LUALS_VERSION: "3.19.0"
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/luals.tar.gz" \
            "https://github.com/LuaLS/lua-language-server/releases/download/${LUALS_VERSION}/lua-language-server-${LUALS_VERSION}-linux-x64.tar.gz"
          sudo mkdir -p /opt/lua-language-server
          sudo tar -xzf "$RUNNER_TEMP/luals.tar.gz" -C /opt/lua-language-server
          printf '#!/bin/sh\nexec /opt/lua-language-server/bin/lua-language-server "$@"\n' \
            | sudo tee /usr/local/bin/lua-language-server >/dev/null
          sudo chmod +x /usr/local/bin/lua-language-server

      - name: Install runtime required by repository setup
        run: scripts/lib/repo-setup.sh --yes

      - name: Run lint checks
        run: scripts/lint.sh --check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Download LÖVE 11.5
        if: runner.os == 'Linux'
        env:
          LOVE_VERSION: "11.5"
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/love.AppImage" \
            "https://github.com/love2d/love/releases/download/${LOVE_VERSION}/love-${LOVE_VERSION}-x86_64.AppImage"
          chmod +x "$RUNNER_TEMP/love.AppImage"
          mkdir -p "$RUNNER_TEMP/love-extracted"
          (
            cd "$RUNNER_TEMP/love-extracted"
            "$RUNNER_TEMP/love.AppImage" --appimage-extract >/dev/null
          )
          "$RUNNER_TEMP/love-extracted/squashfs-root/AppRun" --version

      - name: Install offscreen graphics dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libglx-mesa0

      - name: Install macOS LÖVE runtime
        if: runner.os == 'macOS'
        run: scripts/lib/repo-setup.sh --yes

      - name: Put Linux LÖVE runtime on PATH
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '%s\n' '#!/bin/sh' 'exec "$RUNNER_TEMP/love-extracted/squashfs-root/AppRun" "$@"' > "$RUNNER_TEMP/bin/love"
          chmod +x "$RUNNER_TEMP/bin/love"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Run test suite
        run: scripts/test.sh

      - name: Run runner self-tests
        if: ${{ !cancelled() }}
        run: scripts/test.sh --self-test
